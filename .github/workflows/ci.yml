name: API CI and image

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  release:
    types: [published]
  schedule:
    - cron: '13 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Go checks
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'ci-test' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat internal/version/VERSION)"
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner
      - run: go mod verify
      - name: Check dependency vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Verify simultaneous transfers and graceful shutdown
        run: python3 tests/concurrency_smoke.py

  binaries:
    name: Linux AMD64 binary
    needs: checks
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'ci-build' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and verify binary archive
        run: |
          bash scripts/build-binary.sh
          python3 tests/binary_smoke.py dist/binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speedtest-api-linux-amd64
          path: dist/binaries/*
          if-no-files-found: error
          retention-days: 30

  release-binaries:
    name: Attach binary to published release
    needs: [checks, binaries]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speedtest-api-linux-amd64
          path: binaries
      - name: Verify and upload release assets
        working-directory: binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sha256sum --check --strict binary-SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.tar.gz binary-SHA256SUMS --clobber

  container:
    name: Pull request container verification
    needs: checks
    if: github.event_name != 'push' || !github.ref_protected
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'ci-build' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: speedtest-api:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max
      - name: Smoke test image
        run: python3 tests/container_smoke.py speedtest-api:ci

  build:
    name: Shared container build
    needs: checks
    if: github.event_name == 'push' && github.ref_protected
    uses: Onemind-Services-LLC/actions/.github/workflows/container-build.yml@66ca2225b9030fa1a3f807cfb2464f8d7e87b596
    with:
      registry: registry.onemindservices.com
      image: registry.onemindservices.com/speedtest/api
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  smoke:
    name: Verify built container
    needs: build
    runs-on: ci-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/container
      - name: Install OCI tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Verify artifact and load image
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          source="oci-archive:$RUNNER_TEMP/container/image.tar"
          actual="sha256:$(skopeo inspect --raw "$source" | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_DIGEST"
          skopeo copy --override-os linux --override-arch amd64 \
            "$source" docker-daemon:speedtest-api:ci
      - name: Smoke test the verified image
        run: python3 tests/container_smoke.py speedtest-api:ci

  scan:
    name: Shared container scan
    needs: build
    uses: Onemind-Services-LLC/actions/.github/workflows/container-scan.yml@66ca2225b9030fa1a3f807cfb2464f8d7e87b596
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      digest: ${{ needs.build.outputs.digest }}

  publish:
    name: Shared container publication
    needs: [checks, build, smoke, scan]
    if: github.event_name == 'push' && github.ref_protected && github.repository == 'Onemind-Services-LLC/speedtest-api'
    uses: Onemind-Services-LLC/actions/.github/workflows/container-publish.yml@66ca2225b9030fa1a3f807cfb2464f8d7e87b596
    permissions:
      contents: read
      id-token: write
    with:
      registry: registry.onemindservices.com
      image: registry.onemindservices.com/speedtest/api
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      digest: ${{ needs.build.outputs.digest }}
      signer-identity: https://github.com/Onemind-Services-LLC/actions/.github/workflows/container-publish.yml@66ca2225b9030fa1a3f807cfb2464f8d7e87b596
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}
