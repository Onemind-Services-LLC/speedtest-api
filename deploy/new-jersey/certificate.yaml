apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: speedtest-api
spec:
  secretName: speedtest-api-tls
  dnsNames:
  - nnj.speedtest.onemindservices.cloud
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
